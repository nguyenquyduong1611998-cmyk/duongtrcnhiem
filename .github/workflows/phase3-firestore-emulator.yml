name: Phase 3 Firestore Rules Emulator (synthetic only)

on:
  push:
    branches:
      - feature/unit-auth-stage3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot-firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Java 21 for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator test packages (CI only)
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --legacy-peer-deps firebase-tools@15.37.0 @firebase/rules-unit-testing@6.0.0
      - name: Emulate isolated synthetic Firestore Rules
        run: |
          ./node_modules/.bin/firebase emulators:exec --only firestore --project demo-phase3-session-guard --config firebase.phase3-emulator.json "node --test tests/phase3-firestore-rules.test.mjs"
