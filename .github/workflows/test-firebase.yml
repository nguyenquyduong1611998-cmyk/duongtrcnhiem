
name: Test Firebase Fix

on:
  push:
    branches:
      - fix-firebase-login
      - feature/unit-auth-stage3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install
      - name: Check TypeScript
        run: bun run lint
      - name: Static staging security regression tests
        run: node --test tests/staging-security.test.mjs

      - name: Validate Cloudflare Pages Functions syntax
        run: |
          node --check functions/_shared/auth.mjs
          node --check functions/api/auth/status.js
          node --check functions/api/auth/student/login.js
          node --check functions/api/auth/admin/demo.js
          node --check functions/api/auth/admin/unit-accounts.js
          node --check functions/api/auth/student/unit-verify.js
          node --check functions/api/auth/student/unit-change-password.js
          node --check functions/api/auth/admin/pilot-enrollments.js
          node --check functions/_shared/pilot-password.mjs
          node --check functions/api/auth/admin/pilot-password-reset.js
          node --check functions/api/auth/student/pilot-password-change.js
          node --check functions/_shared/student-session.mjs
          node --check functions/api/auth/student/session-check.js
          node --check functions/api/auth/admin/session-block.js
          node --check functions/_shared/session-mirror-outbox.mjs
          node --check functions/_shared/firestore-session-writer.mjs
          node --check functions/_shared/firebase-auth-revoker.mjs
          node --check functions/_shared/pilot-revocation-coordinator.mjs
          node --check functions/_shared/pilot-outbox-health.mjs
          node --check functions/api/auth/admin/pilot-queue-health.js
          node --check functions/_shared/pilot-unlock-preflight.mjs
          node --check functions/_shared/pilot-unlock-review.mjs
          node --check functions/_shared/pilot-review-admin.mjs
          node --check functions/_shared/pilot-unlock-preparation.mjs
          node --check functions/_shared/synthetic-quiz.mjs
          node --check functions/api/demo-quiz/student.js
          node --check functions/api/demo-quiz/admin.js

      - name: Test Cloudflare D1 demo authentication security
        run: node --test tests/serverless-auth.test.mjs

      - name: Test synthetic D1 account management API
        run: node --test tests/d1-unit-accounts.test.mjs

      - name: Test temporary D1 password verification without Firebase login
        run: node --test tests/d1-unit-verify.test.mjs

      - name: Test synthetic D1 password change (no login)
        run: node --test tests/d1-unit-password-change.test.mjs

      - name: Phase 3 isolation guardrails (real login still disabled)
        run: node --test tests/phase3-auth-isolation.test.mjs

      - name: Phase 3 pilot enrollment API security tests
        run: node --test tests/phase3-pilot-enrollments.test.mjs

      - name: Validate phase 3 SQL schema in memory (no remote D1)
        run: bun run scripts/check-phase3-schema.ts

      - name: Phase 3 password rotation proof in local SQLite (synthetic only)
        run: bun run scripts/check-phase3-password-flow.mjs

      - name: Phase 3 signed Firebase ID token and D1 session guard tests
        run: node --test tests/phase3-student-session.test.mjs

      - name: Phase 3 Admin session blocking and audit in local SQLite
        run: bun run scripts/check-phase3-session-block.mjs

      - name: Phase 3 retryable Firestore revocation outbox in local SQLite
        run: bun run scripts/check-phase3-mirror-outbox.mjs

      - name: Phase 3 Firestore service-account writer authorization and CAS tests
        run: node --test tests/phase3-firestore-writer.test.mjs

      - name: Phase 3 Firebase Auth administrative disable and token cutoff tests
        run: node --test tests/phase3-firebase-auth-revoker.test.mjs

      - name: Phase 3 coordinated D1 Firestore and Auth revocation safety tests
        run: node --test tests/phase3-revocation-coordinator.test.mjs

      - name: Phase 3 coordinated D1 Firestore Auth failure recovery in SQLite
        run: bun run scripts/check-phase3-coordinated-outbox.mjs

      - name: Phase 3 queue health monitoring fail-closed tests
        run: node --test tests/phase3-queue-health.test.mjs

      - name: Phase 3 read-only unlock preflight safety tests
        run: node --test tests/phase3-unlock-preflight.test.mjs

      - name: Phase 3 two-person unlock review and no-direct-activation tests
        run: node --test tests/phase3-unlock-review.test.mjs

      - name: Phase 3 independently signed reviewer Admin and D1 role authorization
        run: node --test tests/phase3-review-admin.test.mjs

      - name: Phase 3 atomic blocked-state unlock preparation tests
        run: node --test tests/phase3-unlock-preparation.test.mjs

      - name: Phase 4 server-graded synthetic quiz and D1 cross-device test
        run: node --test tests/phase4-synthetic-quiz.test.mjs

      - name: Phase 4 HTTP A/B and Admin cross-device authorization E2E simulation
        run: node --test tests/phase4-synthetic-quiz-http-e2e.test.mjs

      - name: Build website
        run: bun run build
        
      - name: Build staging website
        env:
          VITE_FIREBASE_ENV: staging
        run: bun run build

