
name: Test Firebase Fix

on:
  push:
    branches:
      - fix-firebase-login
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install
      - name: Check TypeScript
        run: bun run lint
      - name: Build website
        run: bun run build
        
      - name: Build staging website
        env:
          VITE_FIREBASE_ENV: staging
        run: bun run build

