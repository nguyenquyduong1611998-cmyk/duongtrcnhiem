name: Staging DEMO Quiz Pilot (isolated)

on:
  push:
    branches:
      - feature/staging-demo-quiz-pilot
      - 'fix/phase4-*'
      - 'feature/phase5-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo-quiz-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean feature branch
        uses: actions/checkout@v4
      - name: Install Bun (match Cloudflare Pages)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install exact committed dependencies (Cloudflare-equivalent)
        run: bun install --frozen-lockfile
      - name: Verify installation did not modify lockfile
        run: git diff --exit-code -- bun.lock
      - name: TypeScript validation
        run: bun run lint
      - name: Check Cloudflare Functions syntax
        run: |
          node --check functions/_shared/auth.mjs
          node --check functions/_shared/demo-quiz-token.mjs
          node --check scripts/phase4-inspect-d1-sql-export.mjs
          node --check functions/_shared/synthetic-quiz.mjs
          node --check functions/_shared/phase4-host-guard.mjs
          node --check functions/_shared/staging-db-binding.mjs
          node --check scripts/phase4-public-staging-probe.mjs
          node --check functions/_shared/phase4-staging-preflight.mjs
          node --check functions/api/demo-quiz/student.js
          node --check functions/api/demo-quiz/admin.js
          node --check functions/api/demo-quiz/preflight.js
          node --check functions/_shared/phase5-readonly-topics.mjs
          node --check functions/api/phase5/topics.js
          node --check 'functions/api/phase5/topics/[topicId]/versions/[revision].js'
          node --check functions/_shared/phase5-synthetic-grading.mjs
          node --check functions/api/phase5/attempts/student.js
      - name: Existing DEMO authentication and D1 regressions
        run: |
          node --test tests/staging-security.test.mjs
          node --test tests/serverless-auth.test.mjs
          node --test tests/d1-unit-accounts.test.mjs
          node --test tests/d1-unit-verify.test.mjs
          node --test tests/d1-unit-password-change.test.mjs
      - name: DEMO quiz token and D1 grading tests
        run: node --test tests/phase4-synthetic-quiz.test.mjs
      - name: Browser lost-response recovery, prior scores and no duplicate POST
        run: bun test tests/phase4-browser-submit-recovery.test.ts
      - name: Credential-free staging HTTP inspection simulations (NO network)
        run: node --test tests/phase4-public-staging-probe.test.mjs
      - name: All test Pages previews must use Firebase staging regardless of build variables
        run: bun test tests/phase4-firebase-preview-host.test.ts
      - name: Preview D1 binding isolation, no canonical database fallback
        run: node --test tests/phase4-preview-d1-binding.test.mjs
      - name: Pinned test Pages hostname, production-domain denial and flag gates
        run: node --test tests/phase4-pinned-host.test.mjs
      - name: Cross-device HTTP A/B and Admin simulation
        run: node --test tests/phase4-synthetic-quiz-http-e2e.test.mjs
      - name: Migration rollback and 100-student SQLite rehearsal
        run: node --test tests/phase4-staging-migration-dry-run.test.mjs
      - name: Admin read-only D1 preflight tests
        run: node --test tests/phase4-staging-preflight.test.mjs
      - name: Verify a local SQLite backup safely, without network or writes
        run: node --test tests/phase4-local-backup-verify.test.mjs
      - name: Static SQL export inspection (never execute backup SQL)
        run: node --test tests/phase4-sql-export-static.test.mjs
      - name: Phase 4 isolation and flags OFF by default
        run: node --test tests/phase4-pilot-isolation.test.mjs
      - name: Phase 5 synthetic-only content model and public-key isolation tests
        run: node --test tests/phase5-content-model.test.mjs
      - name: Phase 5B authenticated Preview-only read API, negative auth and answer secrecy
        run: node --test tests/phase5-readonly-topics-http.test.mjs
      - name: Phase 5C Preview backup profile and math-only seed are safe (offline)
        run: node --test tests/phase5-preview-backup-and-seed.test.mjs
      - name: Phase 5 additive Preview schema preserves existing DEMO data (offline)
        run: node --test tests/phase5-preview-additive-schema.test.mjs
      - name: Phase 5 student browser read-only identity, URL and no-key tests
        run: bun test tests/phase5-browser-readonly.test.ts
      - name: Phase 5D server-owned scoring, immutable replay, Preview-only disabled POST tests
        run: node --test tests/phase5-synthetic-grading-http.test.mjs
      - name: Phase 5E browser submit once, lost-response recovery and Preview UI OFF tests
        run: bun test tests/phase5-submission-browser.test.ts
      - name: Build website
        run: bun run build
      - name: Build staging website
        env:
          VITE_FIREBASE_ENV: staging
        run: bun run build
